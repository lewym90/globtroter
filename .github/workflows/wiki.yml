name: Opisy atrakcji
on:
  workflow_dispatch:
  push:
    paths: ['tools/build_wiki.py','.github/workflows/wiki.yml']
concurrency:
  group: attr
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_wiki.py
      - run: |
          git config user.name 'globtroter-bot'
          git config user.email 'globtroter-bot@users.noreply.github.com'
          git add data/attractions.json
          git diff --cached --quiet && exit 0
          git commit -qm 'Opisy atrakcji'
          git pull -q --rebase origin main
          git push -q
