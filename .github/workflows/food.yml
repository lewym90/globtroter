name: Restauracje (OpenStreetMap)
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/food.yml','tools/build_food.py']
  schedule:
    - cron: '23 */3 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: food
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz restauracje
        run: python3 tools/build_food.py | tee food.log
        env:
          BUDGET_S: '1500'
      - name: Zapisz
        run: |
          git config user.name 'globtroter-bot'
          git config user.email 'globtroter-bot@users.noreply.github.com'
          git add data/food
          git diff --cached --quiet && exit 0
          git commit -qm 'Restauracje z OpenStreetMap'
          git pull -q --rebase origin main || true
          git push -q || true
      - name: Kolejny przebieg, gdy czegos brakuje i cos przybylo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(ls data/food | wc -l)
          OK=$(grep -oE 'zapisane [0-9]+' food.log | grep -oE '[0-9]+' || echo 0)
          if [ "$N" -lt 128 ] && [ "${OK:-0}" -gt 0 ]; then sleep 120; gh workflow run food.yml --ref main || true; fi
