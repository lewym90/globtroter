name: Przewodnik
on:
  push:
    branches: [main]
    paths: ['data/attractions.json','data/destinations.json','server/countries.py','tools/build_guide.py']
  workflow_dispatch:
concurrency:
  group: guide
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Zapisz
        run: |
          git config user.name 'globtroter-bot'
          git config user.email 'globtroter-bot@users.noreply.github.com'
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/build_guide.py
            git add data/guide data/countries.json
            git diff --cached --quiet && exit 0
            git commit -qm 'Przewodnik: pliki miejsc'
            git push -q origin HEAD:main && exit 0
            sleep 15
          done
          exit 1
