name: Atrakcje z OpenStreetMap
on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'
concurrency:
  group: attr
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_poi.py | tee poi.log
      - name: Zapisz
        run: |
          git config user.name 'globtroter-bot'
          git config user.email 'globtroter-bot@users.noreply.github.com'
          cp data/attractions.json /tmp/new.json
          [ -f data/poi_done.json ] || echo '[]' > data/poi_done.json; cp data/poi_done.json /tmp/done.json
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/merge_attr.py data/attractions.json /tmp/new.json
            cp /tmp/done.json data/poi_done.json
            git add data/attractions.json data/poi_done.json
            git diff --cached --quiet && break
            git commit -qm 'Atrakcje z OpenStreetMap'
            git push -q origin HEAD:main && break
            sleep 15
            [ "$i" = 6 ] && exit 1
          done
      - name: Kolejna porcja
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -q 'zostalo 0' poi.log; then gh workflow run poi.yml --ref main; fi
