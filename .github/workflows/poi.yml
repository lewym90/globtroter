name: Atrakcje z OpenStreetMap
on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'
concurrency:
  group: attr
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_poi.py
      - name: Zapisz
        run: |
          git config user.name 'globtroter-bot'
          git config user.email 'globtroter-bot@users.noreply.github.com'
          cp data/attractions.json /tmp/new.json
          :
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/merge_attr.py data/attractions.json /tmp/new.json
            git add data/attractions.json 
            git diff --cached --quiet && exit 0
            git commit -qm 'Atrakcje z OpenStreetMap'
            git push -q origin HEAD:main && exit 0
            sleep 15
          done
          exit 1
