name: Godziny atrakcji
on:
  workflow_dispatch:
  push:
    paths: ['tools/build_hours.py','.github/workflows/hours.yml']
  schedule:
    - cron: '41 */6 * * *'
permissions:
  contents: write
concurrency:
  group: attr
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_hours.py
      - run: |
          git config user.name 'globtroter-bot'
          git config user.email 'globtroter-bot@users.noreply.github.com'
          git add data/attractions.json data/hours.json
          git diff --cached --quiet && exit 0
          git commit -qm 'Godziny atrakcji'
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q && break; sleep 8; done
