name: Godziny atrakcji
on:
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'
permissions:
  contents: write
concurrency:
  group: attr
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_hours.py
      - name: Zapisz
        run: |
          git config user.name 'globtroter-bot'
          git config user.email 'globtroter-bot@users.noreply.github.com'
          cp data/attractions.json /tmp/new.json
          cp data/hours.json /tmp/hours.json
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/merge_attr.py data/attractions.json /tmp/new.json
            cp /tmp/hours.json data/hours.json
            git add data/attractions.json data/hours.json
            git diff --cached --quiet && exit 0
            git commit -qm 'Godziny atrakcji'
            git push -q origin HEAD:main && exit 0
            sleep 15
          done
          exit 1
